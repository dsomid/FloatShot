# Builds the Linux and Windows apps and attaches them to the GitHub release.
# The macOS DMG is built locally with build.sh and uploaded when the release is created.
name: Build Linux & Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (e.g. v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FloatShot-windows-x64.zip
          - os: ubuntu-22.04
            asset: FloatShot-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: linux-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name FloatShot
          --icon icon.png --add-data "icon.png${{ runner.os == 'Windows' && ';' || ':' }}."
          floatshot.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cd dist && 7z a "../${{ matrix.asset }}" FloatShot
      # A single portable .exe as well: slower to start (it unpacks itself) but nothing to unzip.
      - name: Build single-file EXE (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --name FloatShot-windows-x64
          --icon icon.png --add-data "icon.png;." --distpath exe
          floatshot.py
      - name: Upload EXE (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" exe/FloatShot-windows-x64.exe --clobber
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist FloatShot
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
